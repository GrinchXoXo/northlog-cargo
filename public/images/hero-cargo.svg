<svg viewBox="0 0 640 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract illustration of stacked shipping containers">
  <rect width="640" height="720" fill="#1b4b43"/>

  <!-- horizon gradient wash -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123833" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1b4b43" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="640" height="720" fill="url(#wash)"/>

  <!-- route line -->
  <path d="M -20 620 C 160 560, 260 600, 360 520 S 560 420, 680 380" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" stroke-dasharray="4 10" fill="none"/>

  <!-- container stack -->
  <g>
    <rect x="90" y="470" width="200" height="90" rx="6" fill="#e6ede9"/>
    <rect x="90" y="470" width="200" height="90" rx="6" fill="none" stroke="#1b4b43" stroke-opacity="0.15" stroke-width="1"/>
    <g stroke="#1b4b43" stroke-opacity="0.18">
      <line x1="90" y1="500" x2="290" y2="500"/>
      <line x1="90" y1="530" x2="290" y2="530"/>
    </g>

    <rect x="120" y="368" width="230" height="90" rx="6" fill="#ff5a1f"/>
    <g stroke="#ffffff" stroke-opacity="0.25">
      <line x1="120" y1="398" x2="350" y2="398"/>
      <line x1="120" y1="428" x2="350" y2="428"/>
    </g>

    <rect x="70" y="266" width="180" height="90" rx="6" fill="#f6f7f4"/>
    <g stroke="#1b4b43" stroke-opacity="0.15">
      <line x1="70" y1="296" x2="250" y2="296"/>
      <line x1="70" y1="326" x2="250" y2="326"/>
    </g>

    <rect x="280" y="286" width="150" height="90" rx="6" fill="#123833"/>
    <g stroke="#ffffff" stroke-opacity="0.12">
      <line x1="280" y1="316" x2="430" y2="316"/>
      <line x1="280" y1="346" x2="430" y2="346"/>
    </g>
  </g>

  <!-- floating status stamp -->
  <g transform="translate(380,140)">
    <rect x="0" y="0" width="220" height="120" rx="14" fill="#f6f7f4"/>
    <circle cx="30" cy="34" r="7" fill="#ff5a1f"/>
    <rect x="50" y="26" width="140" height="8" rx="4" fill="#1b4b43" fill-opacity="0.85"/>
    <rect x="30" y="58" width="160" height="8" rx="4" fill="#5c6b67" fill-opacity="0.5"/>
    <rect x="30" y="78" width="110" height="8" rx="4" fill="#5c6b67" fill-opacity="0.35"/>
    <rect x="30" y="98" width="70" height="14" rx="7" fill="#ff5a1f" fill-opacity="0.15"/>
  </g>
</svg>
