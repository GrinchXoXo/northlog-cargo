<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract illustration of a freight yard">
  <rect width="640" height="480" fill="#eef1ec"/>
  <rect y="320" width="640" height="160" fill="#dfe6df"/>

  <!-- cranes -->
  <g stroke="#1b4b43" stroke-width="6" stroke-linecap="round">
    <line x1="120" y1="320" x2="120" y2="120"/>
    <line x1="120" y1="140" x2="260" y2="100"/>
    <line x1="120" y1="170" x2="240" y2="150"/>
  </g>
  <g stroke="#1b4b43" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <line x1="480" y1="320" x2="480" y2="160"/>
    <line x1="480" y1="180" x2="600" y2="150"/>
  </g>

  <!-- containers -->
  <g>
    <rect x="60" y="330" width="130" height="60" rx="4" fill="#ff5a1f"/>
    <rect x="200" y="330" width="130" height="60" rx="4" fill="#1b4b43"/>
    <rect x="340" y="330" width="130" height="60" rx="4" fill="#f6f7f4"/>
    <rect x="480" y="330" width="130" height="60" rx="4" fill="#8b9793"/>

    <rect x="80" y="270" width="130" height="60" rx="4" fill="#123833"/>
    <rect x="220" y="270" width="130" height="60" rx="4" fill="#ff5a1f" opacity="0.85"/>
  </g>

  <!-- dashed route across the yard -->
  <path d="M 0 420 C 160 400, 300 440, 460 400 S 640 380, 700 400" stroke="#5c6b67" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 8" fill="none"/>
</svg>
